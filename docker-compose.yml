services:
  postgres:
    image: postgres:16
    restart: unless-stopped

    ports:
      - '5433:5432'

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-express_js}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-express_js}']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    ports:
      - '4000:4000'

    env_file:
      - .env

    environment:
      NODE_ENV: development
      PORT: 4000

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
