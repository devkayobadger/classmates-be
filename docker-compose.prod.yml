services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}

    ports:
      - '4000:4000'

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://localhost:4000/api/v1/health/ready'',res=>process.exit(res.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped
